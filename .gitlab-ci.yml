include:
  - project: CalyxOS/ci-templates
    ref: main
    file: /.gerrit-ci-template.yml

python-checks:
  extends: .gerrit_checkout
  stage: build
  image: python:3.11-bookworm
  script:
    - python -m pip install -r scripts/requirements-checks.txt
    - ./scripts/check-python.sh
