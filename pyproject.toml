[tool.ruff]
target-version = "py311"
line-length = 80
include = [
    "scripts/*.py",
    "scripts/hsm_provisioning/*.py",
    "scripts/pkcs11/*.py",
    "scripts/tests/**/*.py",
]
extend-exclude = [
    "scripts/tests/fixtures",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["COM812", "E", "F", "I", "PYI", "UP"]
